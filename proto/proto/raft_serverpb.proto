syntax = "proto3";
package raft_serverpb;

import "raftpb.proto";

option go_package = "github.com/Aetherance/kv/proto/pkg/raft_serverpb;raft_serverpb";

message RaftMessage {
    reserved 1, 2, 3, 5, 6, 7, 8;
    reserved "region_id", "from_peer", "to_peer", "region_epoch",
             "is_tombstone", "start_key", "end_key";

    raftpb.Message message = 4;
}

message KeyValue {
    bytes key = 1;
    bytes value = 2;
}

message RaftSnapshotData {
    reserved 1, 2, 5;
    reserved "region", "file_size", "meta";

    repeated KeyValue data = 3;
}

message Done {}

service RaftService {
    rpc Raft(stream RaftMessage) returns (Done) {}
}

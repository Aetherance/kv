syntax = "proto3";
package raft_serverpb;

import "raftpb.proto";
import "clusterpb.proto";

option go_package = "github.com/Aetherance/kv/proto/pkg/raft_serverpb;raft_serverpb";

message KeyValue {
    bytes key = 1;
    bytes value = 2;
}

message RaftSnapshotData {
    reserved 1, 2, 5;
    reserved "region", "file_size", "meta";

    repeated KeyValue data = 3;
    clusterpb.ClusterMetadata cluster = 4;
}

message Done {}

// RaftEnvelope prevents messages from a different logical cluster from being
// accepted by a store that happens to reuse the same member ID.
message RaftEnvelope {
    uint64 cluster_id = 1;
    raftpb.Message message = 2;
}

service RaftService {
    rpc Raft(stream RaftEnvelope) returns (Done) {}
}

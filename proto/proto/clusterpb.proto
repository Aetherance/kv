syntax = "proto3";

package clusterpb;

option go_package = "github.com/Aetherance/kv/proto/pkg/clusterpb;clusterpb";

message Member {
    uint64 id = 1;
    string raft_address = 2;
}

// ClusterMetadata is the durable application-level membership registry. Raft
// voting roles remain authoritative in raftpb.ConfState.
message ClusterMetadata {
    uint64 cluster_id = 1;
    repeated Member members = 2;
    repeated uint64 removed_member_ids = 3;
    uint64 conf_revision = 4;
}

// ConfChangeContext is replicated with a raftpb.ConfChange. It carries the
// application-level member record and identifies the local waiter to complete.
message ConfChangeContext {
    uint64 proposer_id = 1;
    uint64 sequence = 2;
    Member member = 3;
}

enum MemberRole {
    MemberRoleUnknown = 0;
    MemberRoleVoter = 1;
    MemberRoleLearner = 2;
}

message MemberInfo {
    Member member = 1;
    MemberRole role = 2;
    bool active = 3;
    uint64 match_index = 4;
}

message MemberListRequest {}

message MemberListResponse {
    uint64 cluster_id = 1;
    uint64 leader_id = 2;
    uint64 conf_revision = 3;
    repeated MemberInfo members = 4;
}

message MemberAddRequest {
    uint64 id = 1;
    string raft_address = 2;
    // The first implementation accepts learner additions only. Keeping this
    // field makes an explicit unsafe/direct voter mode possible later.
    bool learner = 3;
}

message MemberAddResponse {
    MemberListResponse cluster = 1;
}

message MemberPromoteRequest {
    uint64 id = 1;
}

message MemberPromoteResponse {
    MemberListResponse cluster = 1;
}

message MemberRemoveRequest {
    uint64 id = 1;
}

message MemberRemoveResponse {
    MemberListResponse cluster = 1;
}

message MemberUpdateRequest {
    uint64 id = 1;
    string raft_address = 2;
}

message MemberUpdateResponse {
    MemberListResponse cluster = 1;
}

message MemberStatusRequest {
    uint64 id = 1;
}

message MemberStatusResponse {
    uint64 leader_id = 1;
    uint64 commit_index = 2;
    MemberInfo member = 3;
}

message JoinInfoRequest {
    uint64 id = 1;
    string raft_address = 2;
}

message JoinInfoResponse {
    uint64 cluster_id = 1;
    uint64 leader_id = 2;
    repeated Member members = 3;
}

service Cluster {
    rpc MemberList(MemberListRequest) returns (MemberListResponse) {}
    rpc MemberAdd(MemberAddRequest) returns (MemberAddResponse) {}
    rpc MemberPromote(MemberPromoteRequest) returns (MemberPromoteResponse) {}
    rpc MemberRemove(MemberRemoveRequest) returns (MemberRemoveResponse) {}
    rpc MemberUpdate(MemberUpdateRequest) returns (MemberUpdateResponse) {}
    rpc MemberStatus(MemberStatusRequest) returns (MemberStatusResponse) {}
    rpc JoinInfo(JoinInfoRequest) returns (JoinInfoResponse) {}
}

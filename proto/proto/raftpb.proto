syntax = "proto3";
package raftpb;

option go_package = "github.com/Aetherance/kv/proto/pkg/raftpb;raftpb";

enum EntryType {
    EntryNormal = 0;
    EntryConfChange = 1;
    // Reserved for the future joint-consensus implementation. Simple
    // one-at-a-time changes continue to use EntryConfChange.
    EntryConfChangeV2 = 2;
}

message Entry {
    EntryType entry_type = 1;
    uint64 term = 2;
    uint64 index = 3;
    bytes data = 4;
}

message SnapshotMetadata {
    ConfState conf_state = 1;
    uint64 index = 2;
    uint64 term = 3;
}

message Snapshot {
    bytes data = 1;
    SnapshotMetadata metadata = 2;
}

enum MessageType {
    MsgHup = 0;
    MsgBeat = 1;
    MsgPropose = 2;
    MsgAppend = 3;
    MsgAppendResponse = 4;
    MsgRequestVote = 5;
    MsgRequestVoteResponse = 6;
    MsgSnapshot = 7;
    MsgHeartbeat = 8;
    MsgHeartbeatResponse = 9;
    MsgTransferLeader = 11;
    MsgTimeoutNow = 12;
}

message Message {
    MessageType msg_type = 1;
    uint64 to = 2;
    uint64 from = 3;
    uint64 term = 4;
    uint64 log_term = 5;
    uint64 index = 6;
    repeated Entry entries = 7;
    uint64 commit = 8;
    Snapshot snapshot = 9;
    bool reject = 10;
}

message HardState {
    uint64 term = 1;
    uint64 vote = 2;
    uint64 commit = 3;
}

message ConfState {
    // Field 1 used to be named "nodes". Renaming it is wire compatible and
    // makes the voting role explicit.
    repeated uint64 voters = 1;
    repeated uint64 learners = 2;

    // These fields mirror etcd/raft's ConfState layout so joint consensus can
    // be added without another durable-format migration.
    repeated uint64 voters_outgoing = 3;
    repeated uint64 learners_next = 4;
    bool auto_leave = 5;
}

enum ConfChangeType {
    AddNode       = 0;
    RemoveNode    = 1;
    UpdateNode    = 2;
    AddLearnerNode = 3;
}

message ConfChange {
    ConfChangeType change_type = 1;
    uint64 node_id = 2;
    bytes context = 3;
}
